<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{

body{font-family:var(--sans);background:var(--paper);color:var(--ink);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:48px 32px}
.frame{max-width:1180px;width:100%}
.eyebrow{font-family:var(--mono);font-size:9px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}

.subtitle{color:var(--muted);font-size:14px;line-height:1.6;max-width:760px;margin-bottom:24px;word-break:keep-all}
svg{width:100%;min-width:980px;display:block}
