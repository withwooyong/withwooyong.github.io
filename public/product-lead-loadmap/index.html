<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>플랫폼 코어 실행 설계 요약으로 이동 중… · 허우용 (Ted)</title>

    <!-- 목적지를 바꿀 때는 아래 세 곳을 함께 수정한다: meta refresh · canonical · a[href] -->
    <meta http-equiv="refresh" content="0; url=/work/" />
    <link rel="canonical" href="https://withwooyong.github.io/work/" />

    <!--
      ⚠️ robots 메타를 **일부러 넣지 않는다.**

      리다이렉트 스텁이라 noindex 가 자연스러워 보이지만, 이 스텁 9개는 전부 canonical 로
      /work/ 를 가리킨다. 구글은 canonical 로 묶인 URL 무리에 붙은 noindex 를 **무리 전체**에
      적용할 수 있어서, 최악의 경우 목적지인 /work/ 가 색인에서 빠진다.
      색인 제외는 canonical 하나로 충분하다 — 중복 URL 은 대표 URL 로 접힌다.

      옆의 public/notion/index.html 은 같은 조합(noindex + canonical)을 쓰지만 그쪽 canonical
      대상은 **외부** Notion 이라 잃을 것이 없었다. 대상이 내부 페이지로 바뀌면서 위험도가 달라졌다.

      이 계약은 e2e/redirects.spec.ts 가 「robots 메타가 0개」로 못 박고 있다.
    -->

    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI",
          "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
        background: #fff;
        color: #111;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #0b0b0c; color: #e9e9ea; }
      }
      main { text-align: center; padding: 2rem; line-height: 1.7; word-break: keep-all; }
      p { margin: 0 0 1rem; font-size: 0.95rem; opacity: 0.75; }
      a { color: inherit; font-weight: 600; }
    </style>
  </head>
  <!--
    data-pagefind-ignore="all" — 사이트 내부 검색(⌘K) 색인에서 이 페이지를 통째로 뺀다.
    없으면 스텁이 검색 결과에 뜨고, 누른 사람은 곧바로 /work/ 로 튕긴다.
    "all" 이어야 제목·메타까지 처리에서 빠진다("index" 는 제목을 여전히 집는다).
  -->
  <body data-pagefind-ignore="all">
    <main id="main" tabindex="-1">
      <p><strong>플랫폼 코어 실행 설계 요약</strong> 페이지는 <strong>/work</strong> 로 합쳐졌습니다. 이동하고 있습니다…</p>
      <a href="/work/">자동으로 이동하지 않으면 여기를 눌러 주세요</a>
    </main>

    <script>
      // meta refresh가 막힌 환경을 위한 보조 경로.
      // replace()를 쓰면 뒤로가기 시 이 페이지로 되돌아오는 루프가 생기지 않는다.
      location.replace("/work/");
    </script>
  </body>
</html>
