<!DOCTYPE html>
<html lang="ko">

    <!-- 목적지를 바꿀 때는 아래 세 곳을 함께 수정한다: meta refresh · canonical · a[href] -->
    <meta http-equiv="refresh" content="0; url=https://fortunate-ghost-cf6.notion.site/Ted-3a5845b3742d8113a393e327716ec4a3" />

    <!-- 리다이렉트 페이지는 검색 색인에서 제외한다 -->
    <meta name="robots" content="noindex, follow" />

    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI",
          "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
        background: #fff;
        color: #111;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #0b0b0c; color: #e9e9ea; }
      }
      main { text-align: center; padding: 2rem; line-height: 1.7; }
      p { margin: 0 0 1rem; font-size: 0.95rem; opacity: 0.75; }
      a { color: inherit; font-weight: 600; }
    </style>
  </head>
  <body>
    <main>
      <p>경력기술서 페이지로 이동하고 있습니다…</p>

        자동으로 이동하지 않으면 여기를 눌러 주세요
      </a>
    </main>

    <script>
      // meta refresh가 막힌 환경을 위한 보조 경로.
      // replace()를 쓰면 뒤로가기 시 이 페이지로 되돌아오는 루프가 생기지 않는다.
      location.replace("https://fortunate-ghost-cf6.notion.site/Ted-3a5845b3742d8113a393e327716ec4a3");

</html>
