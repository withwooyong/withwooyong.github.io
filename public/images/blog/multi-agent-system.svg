<desc id="mas-org-desc">사람이 목표와 최종 승인을 쥐고, 기획·코드·리뷰 에이전트가 파이프라인을 이루며, 테스트·배포 에이전트가 그 파이프라인을 되먹이는 책임 지도입니다.</desc>

