<title id="acs-title">단계별 계약 아홉의 호출 순서</title>
<desc id="acs-desc">사람이 기획에 목표를 주면 기획 · 코드 · 테스트 · 리뷰가 계획서 경로와 수치와 변경분을 차례로 넘기고, 리뷰에 지적이 있으면 코드로 되돌리며, 지적이 없을 때만 사람에게 승인을 요청해 배포로 가는 시퀀스 다이어그램입니다.</desc>

