<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 768" width="1040" height="768" role="img" aria-labelledby="isl-title isl-desc">
<title id="isl-title">정보는 세 층에서 온다</title>
<desc id="isl-desc">조직 전역 층인 Enterprise 관리형 정책에서 사용자 전역 층인 ~/.claude/CLAUDE.md, 프로젝트 층인 프로젝트 루트 CLAUDE.md 로 내려오고, 프로젝트 층에서 서브디렉토리 층의 모듈별 CLAUDE.md, 조건부 규정집 .claude/rules/*.md, 축적 기억 memory / MEMORY.md 의 세 갈래로 나뉜 뒤, 세 갈래가 모두 세션 층인 현재 대화 이력으로 모여 AI의 응답이 되는 플로우차트입니다.</desc>

