<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 212" width="1040" height="212" role="img" aria-labelledby="tsd-title tsd-desc">
<title id="tsd-title">패턴 A — 단계별 업무 분해</title>
<desc id="tsd-desc">Step1 경쟁사 분석에서 Step2 차별화 도출, Step3 마케팅 문구, Step4 런칭 체크리스트로 한 단계씩 순차로 넘어가는 플로우차트입니다.</desc>

