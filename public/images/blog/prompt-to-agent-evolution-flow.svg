<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 228" width="1040" height="228" role="img" aria-labelledby="pae-title pae-desc">
<title id="pae-title">프롬프트에서 Agent 까지의 진화 경로</title>
<desc id="pae-desc">프롬프트는 수동 입력이고, Commands 는 저장하고 반복하며, Skills 는 조건 충족 시 자동 트리거되고, Agent 는 자율 판단하는 순서로 한 칸씩 나아가는 플로우차트입니다.</desc>

<defs>
<marker id="pae-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bfc0c0"/></marker>
</defs>

<rect width="1040" height="228" fill="#2d3142"/>

<!-- connectors (drawn before nodes) -->
<path d="M 240 100 H 292" fill="none" stroke="#bfc0c0" stroke-width="1" marker-end="url(#pae-arrow)"/>
<path d="M 492 100 H 544" fill="none" stroke="#bfc0c0" stroke-width="1" marker-end="url(#pae-arrow)"/>
<path d="M 744 100 H 796" fill="none" stroke="#bfc0c0" stroke-width="1" marker-end="url(#pae-arrow)"/>

