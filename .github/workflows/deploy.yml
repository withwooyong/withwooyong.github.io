name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      # ⚠️ 증명이 스캔보다 먼저다. 증명 없는 0건은 거짓 음성과 구분되지 않는다.
      - name: Prove forbidden-word scanner
        run: npm run check-forbidden:verify

      # [SOFT] 분량 경고는 process.stderr.write 로 나가므로 기본 리포터에서도 보인다(196a3fc).
      # verbose 를 쓰는 이유는 그것이 아니라, 어느 테스트가 실제로 돌았는지를 CI 로그에 남기기 위해서다.
      # 경로 인자를 주지 않는다 — 범위는 vitest.config.ts 의 include 가 정한다.
      # 여기에 tests/blog 를 박으면 나중에 다른 곳에 생긴 테스트를 CI가 조용히 빼먹는다.
      - name: Content invariants
        run: npx vitest run --reporter=verbose

      - name: Scan source for forbidden words
        run: npm run check-forbidden

      - name: Build
        run: npm run build

      # 소스가 깨끗한 것은 산출물이 깨끗하다는 증거가 아니다 —
      # 템플릿이 og:image와 제목을 주입한다. Ted_yanadoo.png가 366곳에 있던 것이 그 경우다.
      - name: Scan built output
        run: npm run check-forbidden:built

      - name: GC-6 baseline
        run: npm run check-baseline

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
