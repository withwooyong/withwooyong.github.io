name: Deploy to GitHub Pages

# 🔴 PR 에도 걸어야 검사가 merge 전에 돈다. 이 트리거가 push 뿐이던 동안
# 22스텝은 main 에 들어간 뒤에야 돌았고, 이 리포에는 프리뷰 환경이 없어
# main 이 곧 프로덕션이다 — 걸러야 할 것이 프로덕션에서 드러나는 구조였다.
# 실제로 다크 모드 대비 1.06 결함이 그 경로로 배포됐다(PR #4·#5).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# ⚠️ 그룹을 "pages" 하나로 두면 PR 검사가 배포와 같은 큐에 끼어든다.
# ref 로 나누면 main 배포는 지금처럼 직렬로 남고 PR 끼리는 서로를 막지 않는다.
# 취소는 PR 에서만 한다 — 배포를 중간에 끊으면 Pages 가 어중간한 상태로 남는다.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # 🔴 20 에서 22 로 올린 근거는 발표본 의존성이었고 그 갈래는 2026-09-12 에
      # 걷어냈다. 그래도 **22 를 내리지 않는다** — Node 를 바꾸면 산출물이 달라져
      # GC-6(비블로그 페이지 불변)이 빨간불이 되기 때문이다. 그 판정은 PR 단계의
      # `Check non-blog baseline` 스텝이 한다.
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      # ⚠️ 증명이 스캔보다 먼저다. 증명 없는 0건은 거짓 음성과 구분되지 않는다.
      - name: Prove forbidden-word scanner
        run: npm run check-forbidden:verify

      # [SOFT] 분량 경고는 process.stderr.write 로 나가므로 기본 리포터에서도 보인다(196a3fc).
      # verbose 를 쓰는 이유는 그것이 아니라, 어느 테스트가 실제로 돌았는지를 CI 로그에 남기기 위해서다.
      # 경로 인자를 주지 않는다 — 범위는 vitest.config.ts 의 include 가 정한다.
      # 여기에 tests/blog 를 박으면 나중에 다른 곳에 생긴 테스트를 CI가 조용히 빼먹는다.
      - name: Content invariants
        run: npx vitest run --reporter=verbose

      - name: Scan source for forbidden words
        run: npm run check-forbidden

      # 🔴 마크업 검사는 훅에만 있고 CI에는 없었다. 훅은 --no-verify 로 지나갈 수 있고
      # 웹 UI 편집은 애초에 훅을 타지 않으므로, 훅만 있는 검사는 지켜지지 않는 검사다.
      - name: Prove markup checker
        run: npm run check-markup:verify

      - name: Scan published markup
        run: npm run check-markup

      # 발행본 밖의 리포 문서. 아무도 보지 않는 동안 렌더 실패가 250회 쌓였고, 발견한 것은
      # 검사기가 아니라 GitHub에서 별표가 그대로 보이는 화면이었다.
      #
      # ⚠️ 대상 수집은 검사기 안에 있다(`--docs`). 여기서 `git ls-files` 로 뽑아 넘기지 마라 —
      # core.quotePath 기본값이 한글 경로를 따옴표로 감싸는 바람에 4개가 조용히 빠진 적이 있다.
      - name: Scan repo docs markup
        run: npm run check-markup:docs

      # 링크가 어디로 가는지는 검사기 여섯 중 아무도 보지 않았고, 문서에 42곳이 깨진 채
      # 남아 있었다. 발행본 1,612개는 온전했다 — 없는 문제를 고치러 가지 않도록 판정은
      # 파서가 한다. 정규식으로 세면 코드 블록 안의 예시 링크가 위반으로 올라온다.
      - name: Prove link checker
        run: npm run check-links:verify

      - name: Scan published links
        run: npm run check-links

      - name: Scan repo docs links
        run: npm run check-links:docs

      # 도식이 그려지는지는 mermaid 자신이 판정한다. 이 검사기의 진짜 위험은 위반을 놓치는
      # 것이 아니라 거짓 0 이다 — Node 에는 DOM 이 없어 파싱에 닿기도 전에 죽는데, 그것을
      # 「위반 없음」으로 세면 초록이 나온다. 실측으로 649개 중 621개가 그렇게 빠졌다.
      # 그래서 검사기는 판정에 도달한 수를 함께 세고, 못 미치면 종료 코드 2 로 죽는다.
      - name: Prove mermaid checker
        run: npm run check-mermaid:verify

      - name: Scan published diagrams
        run: npm run check-mermaid

      - name: Scan repo docs diagrams
        run: npm run check-mermaid:docs

      # 표의 열 수는 위 검사 어느 것도 보지 않는다 — 강조와 링크와 도식을 볼 뿐이다.
      # 셀이 머리 행보다 많으면 GFM 이 초과분을 버리므로 쓴 내용이 화면에서 사라지는데,
      # 실측으로 발행본 2곳 · 리포 문서 2곳이 그 상태였고 검사 셋이 전부 통과시켰다.
      # 넷 중 셋의 기전은 코드 스팬 안의 세로줄이다 — 백틱은 세로줄을 보호하지 않는다.
      - name: Prove table checker
        run: npm run check-table:verify

      - name: Scan published tables
        run: npm run check-table

      - name: Scan repo docs tables
        run: npm run check-table:docs

      # 문서에 적힌 발행본 수가 실제와 맞는지 본다. README 세 곳이 128편에서 멈춰 있는 동안
      # 실제로는 149편이었다(인수인계 §11). 세는 사람이 없으면 숫자는 반드시 낡는다.
      #
      # GC-6와 달리 이 검사는 환경에 종속되지 않는다 — content/blog 의 .md 개수와 README 텍스트만 본다.
      # 자리를 못 찾는 것도 실패로 센다. 그렇지 않으면 README 구조가 바뀔 때 조용히 통과한다.
      - name: Prove count checker
        run: npm run check-counts:verify

      - name: Check documented counts
        run: npm run check-counts

      # 인덱스 생성기는 빌드 안에서 돈다. 증명은 그보다 먼저다 — 증명되지 않은 「184편」은
      # 거짓 음성과 구분되지 않는다. 가드 넷이 대상 없음 · 수 어긋남 · 카나리를 본다.
      - name: Prove search index builder
        run: npm run search-index:verify

      # 마스킹이 이 검사의 전부다. 증명이 없으면 「전량 통과」와 「전량을 마스킹했다」가
      # 구분되지 않는다. 케이스 16개 가운데 넷이 마스킹이 넓어지지 않았음을 본다.
      - name: Prove baseline checker
        run: npm run check-baseline:verify

      - name: Build
        run: npm run build

      # npm install 은 engines 를 강제하지 않아 로컬 Node 에서만 도는 판이 조용히 설치된다 —
      # 실측으로 두 번 CI 를 죽였다(jsdom 30 · 발표본 의존성 넷). 발표본 갈래는 걷어냈으나
      # 같은 함정이 본체 트리에도 그대로 있으므로 이 검사는 남긴다.
      - name: Prove engines checker
        run: npm run check-engines:verify

      - name: Check dependency engines against CI Node
        run: npm run check-engines

      # 소스가 깨끗한 것은 산출물이 깨끗하다는 증거가 아니다 —
      # 템플릿이 og:image와 제목을 주입한다. Ted_yanadoo.png가 366곳에 있던 것이 그 경우다.
      - name: Scan built output
        run: npm run check-forbidden:built

      # GC-6 baseline — 2026-09-09 되살렸다. 2026-08-18 부터 이 자리는 주석이었다.
      #
      # 껐던 이유는 기준선이 **빌드 환경에 종속**된다는 것이었다. Windows 로컬에서 만든
      # 기준선을 ubuntu CI 에서 검사하니 13개가 전부 「변경」으로 잡혔고, public/ 에서 그대로
      # 복사되는 notion/index.html 하나만 일치했다 (run 32103823116).
      #
      # 그때 주석은 「무엇이 다른지 먼저 실측하라」고 남겼다. 2026-09-09 에 그 실측을 했다 —
      # 배포된 실물이 곧 ubuntu 산출물이므로 같은 커밋(8dfbf9c)의 로컬 빌드와 대조했다.
      #
      #   차이는 **JS 청크 파일명의 콘텐츠 해시 하나**였다. index.html 의 청크 참조 10개 중
      #   `_app` 하나만 갈렸고(CI 38524cbf… · 로컬 64080f6e…), css 와 media 의 해시는 같았다.
      #   길이가 같아 **파일 크기는 바이트까지 일치했다** — 크기 대조로는 드러나지 않는다.
      #   그 자리를 buildId 와 같은 방식으로 마스킹하니 15개 전량이 일치했다 (15/15).
      #
      # 그래서 주석이 제시했던 두 방법은 필요하지 않았다:
      #   (a) 기준선을 ubuntu 에서 만들어 커밋한다 — 불필요
      #   (b) CI 안에서 두 번 빌드해 비교한다 — 불필요. 기준선 파일을 없애면 「빌드가
      #       결정적인가」만 보게 되어 GC-6 의 목적(비블로그 페이지 불변)을 잃는다
      #
      # ⚠️ --update 는 CI 가 돌리지 않는다. 자동 갱신하는 순간 이 검사는 아무것도 막지 못한다.
      - name: Check non-blog baseline
        run: npm run check-baseline

      # PR 에서는 배포하지 않으므로 아티팩트도 만들지 않는다.
      # 위의 검사 스텝은 전부 돈다 — 빌드 산출물 스캔이 여기까지 와야 의미가 있다.
      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./out

  deploy:
    # PR 은 검사까지만이다. build 가 통과해도 이 job 은 건너뛴다.
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
