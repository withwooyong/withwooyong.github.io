name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      # ⚠️ 증명이 스캔보다 먼저다. 증명 없는 0건은 거짓 음성과 구분되지 않는다.
      - name: Prove forbidden-word scanner
        run: npm run check-forbidden:verify

      # [SOFT] 분량 경고는 process.stderr.write 로 나가므로 기본 리포터에서도 보인다(196a3fc).
      # verbose 를 쓰는 이유는 그것이 아니라, 어느 테스트가 실제로 돌았는지를 CI 로그에 남기기 위해서다.
      # 경로 인자를 주지 않는다 — 범위는 vitest.config.ts 의 include 가 정한다.
      # 여기에 tests/blog 를 박으면 나중에 다른 곳에 생긴 테스트를 CI가 조용히 빼먹는다.
      - name: Content invariants
        run: npx vitest run --reporter=verbose

      - name: Scan source for forbidden words
        run: npm run check-forbidden

      # 문서에 적힌 발행본 수가 실제와 맞는지 본다. README 세 곳이 128편에서 멈춰 있는 동안
      # 실제로는 149편이었다(인수인계 §11). 세는 사람이 없으면 숫자는 반드시 낡는다.
      #
      # GC-6와 달리 이 검사는 환경에 종속되지 않는다 — content/blog 의 .md 개수와 README 텍스트만 본다.
      # 자리를 못 찾는 것도 실패로 센다. 그렇지 않으면 README 구조가 바뀔 때 조용히 통과한다.
      - name: Prove count checker
        run: npm run check-counts:verify

      - name: Check documented counts
        run: npm run check-counts

      - name: Build
        run: npm run build

      # `npm run build` 끝에 `npx pagefind --site out` 이 붙어 있어 인덱스는 여기서 만들어진다.
      # 그런데 pagefind 는 **스캔할 HTML 을 하나도 못 찾아도 성공으로 끝난다** — out/pagefind/ 가
      # 생기긴 하는데 안이 비고, 화면에서는 「검색해도 아무것도 안 나온다」로만 보인다.
      # 그 out/ 이 그대로 Pages 로 올라가므로 검증은 반드시 배포 경로 안에 있어야 한다.
      - name: Prove pagefind checker
        run: npm run check-pagefind:verify

      - name: Check search index
        run: npm run check-pagefind

      # 소스가 깨끗한 것은 산출물이 깨끗하다는 증거가 아니다 —
      # 템플릿이 og:image와 제목을 주입한다. Ted_yanadoo.png가 366곳에 있던 것이 그 경우다.
      - name: Scan built output
        run: npm run check-forbidden:built

      # GC-6 baseline — 2026-08-18 CI에서 비활성화. 로컬 검사로만 쓴다.
      #
      # 이유: 기준선(scripts/baseline.json)이 **빌드 환경에 종속**된다. Windows 로컬에서 만든
      # 기준선을 ubuntu CI에서 검사하니 Next.js가 생성한 13개 파일이 전부 「변경」으로 잡혔다
      # (run 32103823116). public/ 에서 그대로 복사되는 notion/index.html 하나만 일치했다 —
      # 즉 buildId 마스킹 문제가 아니라 산출물 자체가 환경에 따라 다르다.
      #
      # 이 상태로 두면 검사가 늘 실패하고, 복구 수단인 --update 를 CI가 돌리게 만들고 싶어진다.
      # 그러면 scripts/check-baseline.mjs 헤더가 경고한 「검사가 아무것도 막지 못한다」가 된다.
      #
      # 되살리려면 둘 중 하나를 해야 한다:
      #   (a) 기준선을 CI와 같은 환경(ubuntu-latest, node 20)에서 만들어 커밋한다
      #   (b) CI 안에서 두 번 빌드해 서로 비교한다 — 기준선 파일 자체를 없앤다
      # 무엇이 다른지 먼저 실측하라. 아티팩트를 받아 13개 파일을 diff 하면 나온다.
      #
      # 로컬에서는 그대로 유효하다: npm run build && npm run check-baseline
      #
      # - name: GC-6 baseline
      #   run: npm run check-baseline

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
