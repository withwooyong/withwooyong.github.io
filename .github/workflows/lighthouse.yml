name: Lighthouse

# 라이트하우스는 **경고로만** 돈다(설계서 §11). 배포 게이트가 아니다.
#
# 그래서 deploy.yml 을 건드리지 않고 별도 워크플로로 둔다. 히어로에 그래프가 있는 이상
# 예산 초과는 잦을 텐데, 그 경고를 배포 경로에 섞으면 「무시해도 되는 빨강」을 학습시키고
# 그러면 deploy.yml 의 진짜 게이트(E2E · 금칙어 · 발행본 수 · Pagefind)까지 함께 죽는다.
# 지켜지지 않을 규칙은 규칙 전체를 죽인다.
#
# ⚠️ workflow_dispatch 는 이 파일이 **기본 브랜치에 있을 때만** Actions UI 에 뜬다.
#    main 에 머지되기 전까지 실제로 도는 것은 pull_request 트리거뿐이다.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      # checkout·setup-node 의 메이저는 deploy.yml 과 맞춘다.
      # 이 워크플로는 PR 에서만 도는 탓에 로컬에서 실증할 수 없다 —
      # 실제 CI 에서 돌아 본 적이 있는 버전을 쓰는 것이 유일한 근거다.
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # lighthouserc.json 의 staticDistDir 이 ./out 이다 — 빌드가 없으면
      # LHCI 는 서빙할 것이 없는 채로 빈 결과를 낸다.
      # tests/ci/lighthouse-workflow.test.ts 가 이 순서를 단언한다.
      - name: Build
        run: npm run build

      # 버전을 고정한다. 고정하지 않으면 lhci 새 버전이 나온 날 아무도 건드리지 않은
      # PR 의 수치가 바뀌고, 그 변화를 실제 회귀와 구분할 수 없다.
      - name: Lighthouse CI
        run: |
          npm install -g @lhci/cli@0.15.1
          lhci autorun
        # 예산 초과는 경고다. 배포를 막지 않는다(설계서 §11).
        #
        # ⚠️ lighthouserc.json 의 단언이 전부 warn 이라 이 줄이 없어도 보통은 초록이다.
        #    그럼에도 두는 이유는 **수집 자체가 실패**했을 때(크롬 기동 실패 등)를 덮기 위해서다.
        #    바꿔 말하면 이 잡은 무엇이 잘못돼도 초록이고, 그래서 설정이 말이 되는지는
        #    여기가 아니라 tests/ci/lighthouse-workflow.test.ts 가 딱딱하게 막는다.
        continue-on-error: true

      # 리포트를 리포지토리 밖으로 내보내지 않는다.
      # LHCI 기본값인 temporary-public-storage 는 결과 HTML 을 **누구나 볼 수 있는**
      # 공개 저장소에 올린다. 이 브랜치의 /work · /about 은 아직 main 에 없는 화면이라
      # 그 설정은 배포 전 화면을 외부에 먼저 공개하게 된다.
      - name: Upload Lighthouse report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-report
          path: .lighthouseci/
          retention-days: 7
          if-no-files-found: warn
          # 🔴 .lighthouseci 는 점으로 시작한다. upload-artifact 는 v4.4 부터
          #    숨김 파일을 **기본 제외**하므로 이 줄이 없으면 리포트 15개가 전부 걸러진다.
          #    실측: 첫 PR 실행에서 lhci 가 `Done writing reports to disk` 를 찍은 직후
          #    `No files were found with the provided path: .lighthouseci/` 로 0개가 올라갔다.
          include-hidden-files: true
